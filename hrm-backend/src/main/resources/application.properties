spring.application.name=hrm-backend
server.port=8080

# PostgreSQL Connection Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hrm_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security / JWT
app.jwt.secret=${APP_JWT_SECRET:994db92cb4e96d6a66ad406011970c62e010674fcf97a4f52cf14bf6e82093c1b7e6755d47394540db7683f7b41bea937819db920a7f3c42a0b377c01edb743e}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true





